# Render Blueprint for FULLY AUTOMATED batch production, including publish.
# CLAUDE.md Section 10 Phase 7 / Section 15. Deploy: push this repo to
# GitHub, then in Render: New -> Blueprint -> pick the repo.
#
# THIS PUBLISHES TO YOUTUBE WITH NO HUMAN REVIEW. --upload is in the start
# commands below, and upload.py's PUBLISH_STATUS is "public" — every video
# these workers produce goes live automatically. This was an explicit,
# confirmed choice (see upload.py's docstring) that overrides CLAUDE.md
# Section 11's original non-negotiable human-approval rule. If that stops
# being what you want, delete --upload from both startCommands below (or
# change PUBLISH_STATUS in upload.py) before your next deploy.
#
# SERVICE TYPE — changed from `cron` to `worker` on 2026-09-28:
# Render rejected the original `type: cron` + `disks:` combination with
# "field disks not found in type file.Service" — Render Cron Jobs cannot
# mount persistent disks at all (only Background Workers and Private
# Services can). Since this project's whole state design (state.json,
# topics.yaml done/pending flags, saved YouTube OAuth tokens) depends on a
# disk surviving between runs, these are now `type: worker` — one
# long-running process per channel that stays alive the whole time and
# schedules itself, instead of Render spinning up a fresh container on a
# cron schedule. See pipeline/scheduler.py for the self-scheduling loop
# (runs pipeline.batch every Monday at the given --hour, UTC).
#
# Persistent state — two disks are mounted per service:
#   /app/videos  — state.json per video (so a crash mid-render doesn't
#                  redo paid API work on retry)
#   /app/config  — topics.yaml's done/pending flags, the saved YouTube OAuth
#                  tokens, and google_client_secret.json. This one matters
#                  MORE now that publishing is automatic: without it,
#                  topics.yaml resets to the git repo's version on every
#                  deploy, and an already-published topic could get produced
#                  and published a second time.
# (Render disks aren't available on every plan tier — confirm yours supports
# two before deploying. Background Workers also aren't on Render's free
# tier — confirm your plan covers two paid worker instances.)
#
# One-time steps that must happen BEFORE the first scheduled run, done once
# from your own machine, then copied onto the /app/config disk (Render's
# dashboard has a shell for this):
#   1. Create a Google Cloud OAuth client (Desktop app type), download it as
#      google_client_secret.json.
#   2. `python -m pipeline.upload --authorize --channel en` and `--channel es`
#      — each opens a browser for a one-time human consent (Google requires
#      this; it cannot be scripted away). Produces youtube_token_en.json /
#      youtube_token_es.json.
#   3. Copy google_client_secret.json + both youtube_token_*.json onto the
#      /app/config disk at the paths config/channels.yaml expects.
#
# Secrets NOT in this file — set them in the Render dashboard (Environment
# tab) instead, so they're never committed to git:
#   RUNWAY_API_KEY, ANTHROPIC_API_KEY

services:
  - type: worker
    name: stoic-pipeline-es
    env: docker
    dockerfilePath: ./Dockerfile
    startCommand: "python -m pipeline.scheduler --channel es --count 3 --upload --hour 14"
    disks:
      - name: stoic-pipeline-videos-es
        mountPath: /app/videos
        sizeGB: 10
      - name: stoic-pipeline-config-es
        mountPath: /app/config
        sizeGB: 1
    envVars:
      - key: RUNWAY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: stoic-pipeline-en
    env: docker
    dockerfilePath: ./Dockerfile
    # offset an hour from the ES job so they don't compete for local ffmpeg/RAM if Render ever runs them on the same box
    startCommand: "python -m pipeline.scheduler --channel en --count 3 --upload --hour 15"
    disks:
      - name: stoic-pipeline-videos-en
        mountPath: /app/videos
        sizeGB: 10
      - name: stoic-pipeline-config-en
        mountPath: /app/config
        sizeGB: 1
    envVars:
      - key: RUNWAY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
