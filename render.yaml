# Render Blueprint for FULLY AUTOMATED batch production, including publish.
# CLAUDE.md Section 10 Phase 7 / Section 15. Deploy: push this repo to
# GitHub, then in Render: New -> Blueprint -> pick the repo.
#
# THIS PUBLISHES TO YOUTUBE WITH NO HUMAN REVIEW. --upload is in the start
# commands below, and upload.py's PUBLISH_STATUS is "public" — every video
# these workers produce goes live automatically. This was an explicit,
# confirmed choice (see upload.py's docstring) that overrides CLAUDE.md
# Section 11's original non-negotiable human-approval rule. If that stops
# being what you want, delete --upload from both dockerCommands below (or
# change PUBLISH_STATUS in upload.py) before your next deploy.
#
# TWO DEPLOY BUGS FIXED HERE on 2026-09-28, in order, each caught by
# Render's own Blueprint validator when the previous fix was tried for real:
#   1. `type: cron` + disks -> Render Cron Jobs can't mount persistent disks
#      at all (only Background Workers and Private Services can), so both
#      services are `type: worker` now — a long-running process that stays
#      alive and schedules itself (pipeline/scheduler.py), instead of Render
#      spinning up a fresh container on a cron schedule.
#   2. `disks:` (plural, a list of two) -> Render rejected this too: "field
#      disks not found in type file.Service". Render's real schema allows
#      exactly ONE disk per service, and the field is singular: `disk:`.
#      So each service below gets one disk, mounted at /app/config — that's
#      the one that actually matters for correctness (topics.yaml's
#      done/pending flags, the saved YouTube OAuth tokens): without it,
#      topics.yaml resets to the git repo's version on every restart, and an
#      already-published topic could get produced and published again, live.
#      /app/videos (per-video state.json, so a crash mid-render doesn't redo
#      paid API work) is NOT disk-backed anymore. That's an accepted
#      tradeoff, not an oversight: since these are now long-running workers
#      instead of fresh-per-run cron jobs, /app/videos survives fine across
#      retries within the same running container and is only lost if Render
#      actually restarts/redeploys the service — worst case then is
#      re-generating some paid assets for whatever video was mid-flight, not
#      a duplicate publish. If you later want /app/videos persisted too,
#      that needs a second Render service (Render still allows only one disk
#      per service) or an external store (e.g. S3) — not another `disk:` key
#      on this same service.
#
# (Render disks aren't available on every plan tier — confirm yours supports
# it before deploying. Background Workers also aren't on Render's free tier
# — confirm your plan covers two paid worker instances.)
#
# One-time steps that must happen BEFORE the first scheduled run, done once
# from your own machine, then copied onto the /app/config disk (Render's
# dashboard has a shell for this):
#   1. Create a Google Cloud OAuth client (Desktop app type), download it as
#      google_client_secret.json.
#   2. `python -m pipeline.upload --authorize --channel en` and `--channel es`
#      — each opens a browser for a one-time human consent (Google requires
#      this; it cannot be scripted away). Produces youtube_token_en.json /
#      youtube_token_es.json.
#   3. Copy google_client_secret.json + both youtube_token_*.json onto the
#      /app/config disk at the paths config/channels.yaml expects. Also
#      confirm config/topics.yaml made it onto the disk (the disk mount
#      shadows whatever was baked into the image at /app/config on first
#      boot) — copy it over from the repo if the disk's copy is missing it.
#
# Secrets NOT in this file — set them in the Render dashboard (Environment
# tab) instead, so they're never committed to git:
#   RUNWAY_API_KEY, ANTHROPIC_API_KEY

services:
  - type: worker
    name: stoic-pipeline-es
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "python -m pipeline.scheduler --channel es --count 3 --upload --hour 14"
    disk:
      name: stoic-pipeline-config-es
      mountPath: /app/config
      sizeGB: 1
    envVars:
      - key: RUNWAY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: stoic-pipeline-en
    env: docker
    dockerfilePath: ./Dockerfile
    # offset an hour from the ES job so they don't compete for local ffmpeg/RAM if Render ever runs them on the same box
    dockerCommand: "python -m pipeline.scheduler --channel en --count 3 --upload --hour 15"
    disk:
      name: stoic-pipeline-config-en
      mountPath: /app/config
      sizeGB: 1
    envVars:
      - key: RUNWAY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
